<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>개 고양이 판별기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Gothic+A1:wght@400;600;800;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <svg hidden aria-hidden="true">
    <defs>
      <symbol id="i-dog" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5.5 6.5c0-1.7.9-2.6 2-2.3 1.1.3 1.8 1.6 1.8 3"></path>
        <path d="M18.5 6.5c0-1.7-.9-2.6-2-2.3-1.1.3-1.8 1.6-1.8 3"></path>
        <path d="M12 20c-3.6 0-6.2-2.4-6.2-5.8C5.8 10.6 8.4 7.5 12 7.5s6.2 3.1 6.2 6.7C18.2 17.6 15.6 20 12 20z"></path>
        <circle cx="9.6" cy="13.4" r="0.9" fill="currentColor"></circle>
        <circle cx="14.4" cy="13.4" r="0.9" fill="currentColor"></circle>
      </symbol>
      <symbol id="i-cat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 5.5l1.4 4"></path>
        <path d="M19 5.5l-1.4 4"></path>
        <path d="M5 5.5l3.6 2.2"></path>
        <path d="M19 5.5l-3.6 2.2"></path>
        <path d="M12 20c-3.7 0-6.4-2.5-6.4-6S8.3 7.4 12 7.4s6.4 3.1 6.4 6.6S15.7 20 12 20z"></path>
        <circle cx="9.9" cy="13.2" r="0.9" fill="currentColor"></circle>
        <circle cx="14.1" cy="13.2" r="0.9" fill="currentColor"></circle>
      </symbol>
      <symbol id="i-unknown" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M9.6 9.6a2.5 2.5 0 1 1 3.2 2.4c-.7.2-1.1.8-1.1 1.5v.3"></path>
        <circle cx="11.7" cy="16.8" r="0.9" fill="currentColor" stroke="none"></circle>
      </symbol>
      <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 16V4"></path>
        <path d="M7 9l5-5 5 5"></path>
        <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path>
      </symbol>
    </defs>
  </svg>

  <div class="page">

    <header class="topbar">
      <div class="brand"><span class="brand-dot"></span>DOG OR CAT</div>
      <div class="tags">
        <span>설치 없음</span>
        <span>사진 전송 없음</span>
      </div>
    </header>

    <h1 class="headline">사진 한 장이면<br><em>개인지 고양이인지</em> 끝</h1>
    <p class="lede">판별은 브라우저 안에서 이뤄집니다. 사진은 어디에도 업로드되지 않고, 계정도 필요 없습니다.</p>

    <button type="button" id="dropzone" class="dropzone">
      <span class="dz-left">
        <span class="dz-icon"><svg width="28" height="28"><use href="#i-upload"></use></svg></span>
        <span class="dz-copy">
          <span class="dz-title">사진을 끌어다 놓으세요</span>
          <span class="dz-sub">JPG · PNG · 클릭해서 고를 수도 있습니다</span>
        </span>
      </span>
      <span class="dz-btn">사진 고르기</span>
    </button>
    <input type="file" id="fileInput" accept="image/*" hidden>

    <p id="status" class="status">모델을 불러오는 중...</p>

    <section id="result" class="result" hidden>
      <img id="preview" class="preview" alt="업로드한 사진">
      <div class="verdict">
        <div class="verdict-label">판별 결과</div>
        <div class="verdict-row">
          <div class="verdict-main">
            <svg class="verdict-icon" width="38" height="38"><use id="verdictIcon" href="#i-dog"></use></svg>
            <span id="verdictText" class="verdict-text">판별 중...</span>
          </div>
          <div id="percent" class="percent"></div>
        </div>
        <div class="meter"><div id="meterFill" class="meter-fill"></div></div>
        <div class="meter-legend">
          <span>신뢰도</span>
          <span>30% 미만이면 판별하지 않습니다</span>
        </div>
      </div>
    </section>

    <section class="states">
      <h2 class="section-label">가능한 답</h2>
      <ul class="state-list">
        <li><svg class="state-icon is-dog" width="24" height="24"><use href="#i-dog"></use></svg>개입니다</li>
        <li><svg class="state-icon is-cat" width="24" height="24"><use href="#i-cat"></use></svg>고양이입니다</li>
        <li class="muted"><svg class="state-icon is-unknown" width="24" height="24"><use href="#i-unknown"></use></svg>둘 다 아닙니다</li>
      </ul>
    </section>

    <footer class="footer">
      <span>브라우저에서만 판별 · 사진 전송 없음</span>
      <span class="footer-tech">TENSORFLOW.JS MOBILENET</span>
    </footer>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
