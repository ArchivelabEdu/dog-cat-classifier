<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;600;800&family=Nanum+Pen+Script&display=swap">
  <style>
    body { margin: 0; background: #FFF4E9; font-family: 'Gothic A1', 'Apple SD Gothic Neo', sans-serif; }
    a { color: #FF4E1A; text-decoration: none; }
    a:hover { color: #D63A0C; }
  </style>
</helmet>

<div style="width: 900px; background: #FFF4E9; color: #2B1A12;">

  <!-- HERO -->
  <div style="position: relative; overflow: hidden; padding: 40px 56px 44px;">

    <div style="position: absolute; right: -130px; top: -160px; width: 400px; height: 400px; border-radius: 50%; background: #FFDCCB;"></div>
    <div style="position: absolute; right: 60px; top: 210px; width: 96px; height: 96px;">
      <svg viewBox="0 0 100 100" width="96" height="96">
        <g fill="#FF8FBF">
          <ellipse cx="50" cy="50" rx="13" ry="36"></ellipse>
          <ellipse cx="50" cy="50" rx="13" ry="36" transform="rotate(45 50 50)"></ellipse>
          <ellipse cx="50" cy="50" rx="13" ry="36" transform="rotate(90 50 50)"></ellipse>
          <ellipse cx="50" cy="50" rx="13" ry="36" transform="rotate(135 50 50)"></ellipse>
        </g>
        <circle cx="50" cy="50" r="13" fill="#FFC94A"></circle>
      </svg>
    </div>
    <div style="position: absolute; left: 18px; top: 250px;">
      <svg viewBox="0 0 60 60" width="44" height="44">
        <g stroke="#FF4E1A" stroke-width="8" stroke-linecap="round">
          <line x1="30" y1="10" x2="30" y2="50"></line>
          <line x1="13" y1="20" x2="47" y2="40"></line>
          <line x1="13" y1="40" x2="47" y2="20"></line>
        </g>
      </svg>
    </div>

    <div style="position: relative; display: flex; flex-direction: column; gap: 30px;">

      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="font-family: 'Black Han Sans', 'Gothic A1', sans-serif; font-size: 21px; letter-spacing: -0.4px; color: #FF4E1A; line-height: 1.15;">
          개 고양이<br>판별기
        </div>
        <div style="display: flex; gap: 10px; align-items: center; font-size: 13px; font-weight: 600; color: #8A6A56;">
          <span style="background: #FFE3D2; color: #C43C0F; padding: 7px 14px; border-radius: 999px;">설치 없음</span>
          <span style="background: #FFE3D2; color: #C43C0F; padding: 7px 14px; border-radius: 999px;">무료</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; max-width: 560px;">
        <div style="font-family: 'Black Han Sans', 'Gothic A1', sans-serif; font-size: 74px; line-height: 0.98; letter-spacing: -1.5px; color: #2B1A12;">
          사진 한 장으로
        </div>
        <div style="font-family: 'Black Han Sans', 'Gothic A1', sans-serif; font-size: 74px; line-height: 0.98; letter-spacing: -1.5px; color: #FF4E1A;">
          개냐 고양이냐
        </div>
        <div style="font-family: 'Nanum Pen Script', cursive; font-size: 58px; line-height: 1; color: #FF5FA2; transform: rotate(-3deg); margin: 4px 0 0 6px;">
          올리면 바로 알려드려요
        </div>
      </div>

      <div style="font-size: 17px; line-height: 1.65; color: #6B4A38; max-width: 430px;">
        판별은 브라우저 안에서 끝납니다. 사진은 어디에도 업로드되지 않고, 회원가입도 필요 없어요.
      </div>

      <!-- DROPZONE -->
      <div style="background: #FFFCF8; border: 3px dashed #FFA07A; border-radius: 26px; padding: 34px 36px; display: flex; align-items: center; justify-content: space-between; gap: 28px; box-shadow: 0 10px 0 #FFE3D2;">
        <div style="display: flex; align-items: center; gap: 20px;">
          <div style="width: 60px; height: 60px; border-radius: 18px; background: #FFE3D2; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#FF4E1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 16V4"></path>
              <path d="M7 9l5-5 5 5"></path>
              <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path>
            </svg>
          </div>
          <div style="display: flex; flex-direction: column; gap: 5px;">
            <div style="font-size: 19px; font-weight: 800; color: #2B1A12;">사진을 끌어다 놓으세요</div>
            <div style="font-size: 14px; color: #8A6A56;">JPG · PNG · 클릭해서 고를 수도 있어요</div>
          </div>
        </div>
        <div style="background: #FF4E1A; color: #FFF4E9; font-family: 'Black Han Sans', 'Gothic A1', sans-serif; font-size: 17px; padding: 16px 30px; border-radius: 999px; white-space: nowrap; letter-spacing: -0.3px;">
          사진 고르기
        </div>
      </div>

    </div>
  </div>

  <!-- RESULT -->
  <div style="padding: 8px 56px 44px;">
    <div style="background: #FF4E1A; border-radius: 30px; padding: 30px; display: flex; gap: 28px; align-items: stretch;">

      <div style="width: 210px; height: 210px; border-radius: 22px; overflow: hidden; flex-shrink: 0; background: #FFD9C6;">
        <svg viewBox="0 0 200 200" width="210" height="210" role="img" aria-label="업로드한 사진 예시">
          <rect width="200" height="200" fill="#FFD9C6"></rect>
          <ellipse cx="52" cy="78" rx="25" ry="41" transform="rotate(-18 52 78)" fill="#A8683F"></ellipse>
          <ellipse cx="148" cy="78" rx="25" ry="41" transform="rotate(18 148 78)" fill="#A8683F"></ellipse>
          <ellipse cx="100" cy="106" rx="57" ry="53" fill="#D08A54"></ellipse>
          <ellipse cx="100" cy="134" rx="33" ry="25" fill="#F0C89E"></ellipse>
          <circle cx="80" cy="100" r="7" fill="#3B2415"></circle>
          <circle cx="120" cy="100" r="7" fill="#3B2415"></circle>
          <ellipse cx="100" cy="124" rx="10" ry="7.5" fill="#3B2415"></ellipse>
          <path d="M100 132 v7 M100 139 q-10 8 -18 1 M100 139 q10 8 18 1" stroke="#3B2415" stroke-width="3.5" fill="none" stroke-linecap="round"></path>
          <path d="M91 148 h18 a9 9 0 0 1 -18 0 z" fill="#FF7E9D"></path>
        </svg>
      </div>

      <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px;">
        <div style="font-size: 13px; font-weight: 800; letter-spacing: 2px; color: #FFC0A5;">판별 결과</div>
        <div style="display: flex; align-items: center; gap: 14px;">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#FFF4E9" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5.5 6.5c0-1.7.9-2.6 2-2.3 1.1.3 1.8 1.6 1.8 3"></path>
            <path d="M18.5 6.5c0-1.7-.9-2.6-2-2.3-1.1.3-1.8 1.6-1.8 3"></path>
            <path d="M12 20c-3.6 0-6.2-2.4-6.2-5.8C5.8 10.6 8.4 7.5 12 7.5s6.2 3.1 6.2 6.7C18.2 17.6 15.6 20 12 20z"></path>
            <circle cx="9.6" cy="13.4" r="0.9" fill="#FFF4E9"></circle>
            <circle cx="14.4" cy="13.4" r="0.9" fill="#FFF4E9"></circle>
            <path d="M12 15.6v1.2"></path>
          </svg>
          <div style="font-family: 'Black Han Sans', 'Gothic A1', sans-serif; font-size: 56px; line-height: 1; color: #FFF4E9; letter-spacing: -1px;">개입니다</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 9px; max-width: 400px;">
          <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; color: #FFD9C6;">
            <span>신뢰도</span>
            <span>87%</span>
          </div>
          <div style="height: 14px; border-radius: 999px; background: #D63A0C; overflow: hidden;">
            <div style="width: 87%; height: 100%; background: #FFC94A; border-radius: 999px;"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- STATES -->
  <div style="padding: 0 56px 40px; display: flex; flex-direction: column; gap: 16px;">
    <div style="font-size: 14px; font-weight: 800; color: #8A6A56; letter-spacing: 0.5px;">이렇게 세 가지로 답합니다</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px;">

      <div style="background: #FFFCF8; border-radius: 20px; padding: 20px; display: flex; align-items: center; gap: 12px; border: 2px solid #FFE3D2;">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#FF4E1A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5.5 6.5c0-1.7.9-2.6 2-2.3 1.1.3 1.8 1.6 1.8 3"></path>
          <path d="M18.5 6.5c0-1.7-.9-2.6-2-2.3-1.1.3-1.8 1.6-1.8 3"></path>
          <path d="M12 20c-3.6 0-6.2-2.4-6.2-5.8C5.8 10.6 8.4 7.5 12 7.5s6.2 3.1 6.2 6.7C18.2 17.6 15.6 20 12 20z"></path>
        </svg>
        <span style="font-size: 15px; font-weight: 800;">개입니다</span>
      </div>

      <div style="background: #FFFCF8; border-radius: 20px; padding: 20px; display: flex; align-items: center; gap: 12px; border: 2px solid #FFE3D2;">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#FF5FA2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 5.5l1.4 4"></path>
          <path d="M19 5.5l-1.4 4"></path>
          <path d="M5 5.5l3.6 2.2"></path>
          <path d="M19 5.5l-3.6 2.2"></path>
          <path d="M12 20c-3.7 0-6.4-2.5-6.4-6S8.3 7.4 12 7.4s6.4 3.1 6.4 6.6S15.7 20 12 20z"></path>
          <path d="M9.9 13.2h.02M14.1 13.2h.02"></path>
          <path d="M4.6 14.4h3.2M16.2 14.4h3.2"></path>
        </svg>
        <span style="font-size: 15px; font-weight: 800;">고양이입니다</span>
      </div>

      <div style="background: #FFFCF8; border-radius: 20px; padding: 20px; display: flex; align-items: center; gap: 12px; border: 2px solid #FFE3D2;">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#B08A72" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M9.6 9.6a2.5 2.5 0 1 1 3.2 2.4c-.7.2-1.1.8-1.1 1.5v.3"></path>
          <circle cx="11.7" cy="16.8" r="0.9" fill="#B08A72" stroke="none"></circle>
        </svg>
        <span style="font-size: 15px; font-weight: 800; color: #6B4A38;">둘 다 아닙니다</span>
      </div>

    </div>
  </div>

  <!-- FOOTER -->
  <div style="padding: 0 56px 44px;">
    <div style="border-top: 2px solid #FFE3D2; padding-top: 22px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #8A6A56; font-weight: 600;">
      <span>브라우저에서만 판별 · 사진 전송 없음</span>
      <span>TensorFlow.js MobileNet</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
