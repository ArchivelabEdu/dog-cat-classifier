<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gaegu:wght@700&family=Gothic+A1:wght@400;600;800&display=swap">
  <style>
    body { margin: 0; background: #FFF8E7; font-family: 'Gothic A1', 'Apple SD Gothic Neo', sans-serif; }
    a { color: #1B5BFF; text-decoration: none; }
    a:hover { color: #0B3FC4; }
  </style>
</helmet>

<div style="width: 900px; background: #FFF8E7; color: #101828;">

  <!-- HERO -->
  <div style="position: relative; background: #FFD400; padding: 34px 52px 60px; overflow: hidden;">

    <div style="position: absolute; left: 26px; top: 150px;">
      <svg viewBox="0 0 60 60" width="46" height="46">
        <g stroke="#FF5FA2" stroke-width="9" stroke-linecap="round">
          <line x1="30" y1="9" x2="30" y2="51"></line>
          <line x1="12" y1="19" x2="48" y2="41"></line>
          <line x1="12" y1="41" x2="48" y2="19"></line>
        </g>
      </svg>
    </div>
    <div style="position: absolute; right: 300px; top: 26px;">
      <svg viewBox="0 0 80 40" width="70" height="35" fill="none" stroke="#1B5BFF" stroke-width="8" stroke-linecap="round">
        <path d="M6 26 Q18 6 30 26 T54 26 T74 20"></path>
      </svg>
    </div>
    <div style="position: absolute; right: 44px; bottom: 96px;">
      <svg viewBox="0 0 60 60" width="52" height="52">
        <path d="M30 4 L36 22 L55 22 L40 33 L46 52 L30 41 L14 52 L20 33 L5 22 L24 22 Z" fill="#12B76A" stroke="#101828" stroke-width="3" stroke-linejoin="round"></path>
      </svg>
    </div>
    <div style="position: absolute; left: 330px; bottom: 22px; width: 26px; height: 26px; border-radius: 50%; background: #FF5FA2; border: 3px solid #101828;"></div>

    <div style="position: relative; display: flex; flex-direction: column; gap: 26px;">

      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="font-family: 'Do Hyeon', 'Gothic A1', sans-serif; font-size: 24px; color: #1B5BFF; text-shadow: 2px 2px 0 #FFF8E7;">
          개냐 고양이냐
        </div>
        <div style="background: #FF5FA2; color: #FFF8E7; border: 3px solid #101828; box-shadow: 4px 4px 0 #101828; border-radius: 999px; padding: 11px 22px; font-family: 'Do Hyeon', sans-serif; font-size: 15px;">
          지금 바로 판별
        </div>
      </div>

      <div style="display: flex; gap: 30px; align-items: center;">

        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px;">
          <div style="font-family: 'Do Hyeon', 'Gothic A1', sans-serif; font-size: 62px; line-height: 1.06; color: #1B5BFF; text-shadow: 4px 4px 0 #FF5FA2;">
            사진 올리면<br>바로 알려줌!
          </div>
          <div style="font-family: 'Gaegu', 'Gothic A1', cursive; font-size: 26px; color: #E8452F; line-height: 1.3;">
            고민하지 말고 그냥 올려보세요 ✱
          </div>
          <div style="font-size: 16px; line-height: 1.6; color: #101828; max-width: 380px; font-weight: 600;">
            판별은 브라우저 안에서 끝납니다. 사진은 어디에도 업로드되지 않아요.
          </div>
        </div>

        <div style="width: 250px; height: 250px; flex-shrink: 0; background: #FFF8E7; border: 4px solid #101828; border-radius: 26px; box-shadow: 8px 8px 0 #1B5BFF; overflow: hidden;">
          <svg viewBox="0 0 200 200" width="242" height="242" role="img" aria-label="업로드한 사진 예시">
            <rect width="200" height="200" fill="#FFE9A8"></rect>
            <ellipse cx="52" cy="78" rx="25" ry="41" transform="rotate(-18 52 78)" fill="#A8683F"></ellipse>
            <ellipse cx="148" cy="78" rx="25" ry="41" transform="rotate(18 148 78)" fill="#A8683F"></ellipse>
            <ellipse cx="100" cy="106" rx="57" ry="53" fill="#D08A54"></ellipse>
            <ellipse cx="100" cy="134" rx="33" ry="25" fill="#F5D6AE"></ellipse>
            <circle cx="80" cy="100" r="7" fill="#101828"></circle>
            <circle cx="120" cy="100" r="7" fill="#101828"></circle>
            <ellipse cx="100" cy="124" rx="10" ry="7.5" fill="#101828"></ellipse>
            <path d="M100 132 v7 M100 139 q-10 8 -18 1 M100 139 q10 8 18 1" stroke="#101828" stroke-width="3.5" fill="none" stroke-linecap="round"></path>
            <path d="M91 148 h18 a9 9 0 0 1 -18 0 z" fill="#FF5FA2"></path>
          </svg>
        </div>

      </div>
    </div>
  </div>

  <!-- WAVE DIVIDER -->
  <div style="line-height: 0; margin-top: -2px;">
    <svg viewBox="0 0 900 46" width="900" height="46" preserveAspectRatio="none">
      <path d="M0 30 Q75 -2 150 22 T300 22 T450 22 T600 22 T750 22 T900 14 L900 46 L0 46 Z" fill="#FFF8E7"></path>
    </svg>
  </div>

  <!-- DROPZONE -->
  <div style="padding: 10px 52px 34px;">
    <div style="background: #FFFFFF; border: 4px dashed #1B5BFF; border-radius: 26px; padding: 34px; display: flex; align-items: center; justify-content: space-between; gap: 26px;">
      <div style="display: flex; align-items: center; gap: 20px;">
        <div style="width: 62px; height: 62px; border-radius: 16px; background: #FFD400; border: 3px solid #101828; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#101828" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 16V4"></path>
            <path d="M7 9l5-5 5 5"></path>
            <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path>
          </svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 5px;">
          <div style="font-family: 'Do Hyeon', sans-serif; font-size: 24px; color: #101828;">여기에 사진을 끌어다 놓기</div>
          <div style="font-size: 14px; color: #475467; font-weight: 600;">클릭해서 파일을 골라도 됩니다 · JPG, PNG</div>
        </div>
      </div>
      <div style="background: #12B76A; color: #FFFFFF; border: 3px solid #101828; box-shadow: 5px 5px 0 #101828; border-radius: 14px; padding: 16px 28px; font-family: 'Do Hyeon', sans-serif; font-size: 18px; white-space: nowrap;">
        사진 고르기
      </div>
    </div>
  </div>

  <!-- RESULT -->
  <div style="padding: 0 52px 36px;">
    <div style="background: #1B5BFF; border: 4px solid #101828; box-shadow: 10px 10px 0 #FF5FA2; border-radius: 28px; padding: 32px 34px; display: flex; flex-direction: column; gap: 20px;">

      <div style="font-family: 'Gaegu', cursive; font-size: 24px; color: #FFD400;">두구두구두구...</div>

      <div style="display: flex; align-items: center; gap: 18px;">
        <svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="#FFD400" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5.5 6.5c0-1.7.9-2.6 2-2.3 1.1.3 1.8 1.6 1.8 3"></path>
          <path d="M18.5 6.5c0-1.7-.9-2.6-2-2.3-1.1.3-1.8 1.6-1.8 3"></path>
          <path d="M12 20c-3.6 0-6.2-2.4-6.2-5.8C5.8 10.6 8.4 7.5 12 7.5s6.2 3.1 6.2 6.7C18.2 17.6 15.6 20 12 20z"></path>
          <circle cx="9.6" cy="13.4" r="0.9" fill="#FFD400"></circle>
          <circle cx="14.4" cy="13.4" r="0.9" fill="#FFD400"></circle>
        </svg>
        <div style="font-family: 'Do Hyeon', sans-serif; font-size: 60px; line-height: 1; color: #FFFFFF; text-shadow: 3px 3px 0 #101828;">개입니다!</div>
      </div>

      <div style="display: flex; align-items: center; gap: 16px;">
        <div style="flex-grow: 1; height: 22px; border-radius: 999px; background: #0B3FC4; border: 3px solid #101828; overflow: hidden;">
          <div style="width: 87%; height: 100%; background: #FFD400;"></div>
        </div>
        <div style="font-family: 'Do Hyeon', sans-serif; font-size: 30px; color: #FFD400; white-space: nowrap;">87%</div>
      </div>

    </div>
  </div>

  <!-- STATES -->
  <div style="padding: 0 52px 34px; display: flex; flex-direction: column; gap: 14px;">
    <div style="font-family: 'Gaegu', cursive; font-size: 24px; color: #101828;">답은 셋 중 하나!</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px;">

      <div style="background: #FFD400; border: 3px solid #101828; border-radius: 18px; padding: 18px; display: flex; align-items: center; gap: 11px; box-shadow: 4px 4px 0 #101828;">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#101828" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5.5 6.5c0-1.7.9-2.6 2-2.3 1.1.3 1.8 1.6 1.8 3"></path>
          <path d="M18.5 6.5c0-1.7-.9-2.6-2-2.3-1.1.3-1.8 1.6-1.8 3"></path>
          <path d="M12 20c-3.6 0-6.2-2.4-6.2-5.8C5.8 10.6 8.4 7.5 12 7.5s6.2 3.1 6.2 6.7C18.2 17.6 15.6 20 12 20z"></path>
        </svg>
        <span style="font-family: 'Do Hyeon', sans-serif; font-size: 17px;">개입니다</span>
      </div>

      <div style="background: #FF5FA2; border: 3px solid #101828; border-radius: 18px; padding: 18px; display: flex; align-items: center; gap: 11px; box-shadow: 4px 4px 0 #101828;">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 5.5l1.4 4"></path>
          <path d="M19 5.5l-1.4 4"></path>
          <path d="M5 5.5l3.6 2.2"></path>
          <path d="M19 5.5l-3.6 2.2"></path>
          <path d="M12 20c-3.7 0-6.4-2.5-6.4-6S8.3 7.4 12 7.4s6.4 3.1 6.4 6.6S15.7 20 12 20z"></path>
        </svg>
        <span style="font-family: 'Do Hyeon', sans-serif; font-size: 17px; color: #FFFFFF;">고양이입니다</span>
      </div>

      <div style="background: #FFFFFF; border: 3px solid #101828; border-radius: 18px; padding: 18px; display: flex; align-items: center; gap: 11px; box-shadow: 4px 4px 0 #101828;">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#475467" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M9.6 9.6a2.5 2.5 0 1 1 3.2 2.4c-.7.2-1.1.8-1.1 1.5v.3"></path>
          <circle cx="11.7" cy="16.8" r="0.9" fill="#475467" stroke="none"></circle>
        </svg>
        <span style="font-family: 'Do Hyeon', sans-serif; font-size: 17px; color: #475467;">둘 다 아님</span>
      </div>

    </div>
  </div>

  <!-- FOOTER -->
  <div style="background: #1B5BFF; padding: 22px 52px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; color: #FFF8E7;">
    <span>브라우저에서만 판별 · 사진 전송 없음</span>
    <span style="color: #FFD400;">TensorFlow.js MobileNet</span>
  </div>

</div>
</x-dc>
</body>
</html>
